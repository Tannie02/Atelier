services:
  - type: web
    name: atelier-ai-platform
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
